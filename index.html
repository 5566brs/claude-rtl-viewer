<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8" />
<title>Claude RTL Viewer</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
  :root {
    --bg: #f6f6f4;
    --panel: #ffffff;
    --panel-2: #fbfaf6;
    --user-bg: #e8f0fb;
    --border: #e8e8e3;
    --border-strong: #d8d6cf;
    --text: #1f1f1c;
    --muted: #8a8a85;
    --code-bg: #f1efe9;
    --accent: #2a662a;
    --hover: #efece4;
    --active: #ddebda;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Heebo", "Arial Hebrew", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.65;
  }

  .layout {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 20px;
    max-width: 1240px;
    margin: 0 auto;
    padding: 18px 20px 80px;
    align-items: start;
  }
  @media (max-width: 880px) {
    .layout { grid-template-columns: 1fr; padding: 12px; }
    .sidebar { position: static !important; max-height: 280px !important; }
  }

  /* Main */
  .main { min-width: 0; }
  .main-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
    direction: ltr;
  }
  .main-header h1 {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin: 0;
    letter-spacing: 0.3px;
  }
  #file {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 11px;
    color: var(--muted);
    direction: ltr;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 60%;
  }

  #status {
    position: fixed;
    top: 10px;
    inset-inline-start: 12px;
    font-size: 10px;
    padding: 3px 9px;
    border-radius: 10px;
    background: #e0ddd6;
    color: #6b6b66;
    font-family: ui-monospace, monospace;
    z-index: 10;
  }
  #status.live { background: #d4ecd4; color: var(--accent); }
  #status.dead { background: #f1d4d4; color: #a33; }

  .msg {
    margin: 0 0 14px;
    padding: 14px 18px;
    border-radius: 12px;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }
  .msg.user { background: var(--user-bg); }
  .msg.assistant { background: var(--panel); border: 1px solid var(--border); }
  .msg.tool {
    margin: 4px 0 10px;
    padding: 3px 12px;
    border-radius: 0;
    border-inline-start: 2px solid var(--border-strong);
    background: transparent;
    color: var(--muted);
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.2px;
  }
  .role {
    font-size: 10px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: 0.6px;
    font-family: ui-monospace, monospace;
    direction: ltr;
    unicode-bidi: isolate;
  }

  .body { unicode-bidi: plaintext; }
  .body > *:first-child { margin-top: 0; }
  .body > *:last-child { margin-bottom: 0; }
  .body p, .body li, .body h1, .body h2, .body h3, .body h4, .body blockquote {
    unicode-bidi: plaintext;
  }
  .body p { margin: 0.55em 0; }
  .body h1, .body h2, .body h3, .body h4 { margin: 0.8em 0 0.4em; line-height: 1.3; }
  .body h1 { font-size: 1.35em; }
  .body h2 { font-size: 1.18em; }
  .body h3 { font-size: 1.05em; }
  .body ul, .body ol { padding-inline-start: 26px; margin: 0.4em 0; }
  .body li { margin: 0.2em 0; }
  .body blockquote {
    border-inline-start: 3px solid #d0cec7;
    margin: 0.5em 0;
    padding: 0.1em 12px;
    color: #555;
  }
  .body pre {
    background: var(--code-bg);
    padding: 10px 12px;
    border-radius: 6px;
    overflow-x: auto;
    direction: ltr;
    text-align: left;
    unicode-bidi: embed;
    font-size: 0.88em;
    line-height: 1.5;
  }
  .body code {
    background: var(--code-bg);
    padding: 1px 6px;
    border-radius: 3px;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 0.9em;
    direction: ltr;
    unicode-bidi: embed;
  }
  .body pre code { background: none; padding: 0; font-size: 1em; }
  .body a { color: #1a5fb4; }
  .body table { border-collapse: collapse; margin: 0.5em 0; }
  .body th, .body td { border: 1px solid var(--border); padding: 4px 8px; }

  #empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    font-size: 13px;
  }

  /* Sidebar */
  .sidebar {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    position: sticky;
    top: 14px;
    max-height: calc(100vh - 28px);
    display: flex;
    flex-direction: column;
  }
  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    direction: rtl;
  }
  .sidebar-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.4px;
  }
  .latest-btn {
    border: 1px solid var(--border-strong);
    background: var(--panel-2);
    color: var(--text);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
  }
  .latest-btn.active {
    background: var(--active);
    border-color: #b6d4af;
    color: var(--accent);
  }
  .latest-btn:hover { background: var(--hover); }

  #sessions {
    overflow-y: auto;
    flex: 1;
    direction: rtl;
  }
  .session {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    direction: rtl;
  }
  .session:hover { background: var(--hover); }
  .session.active { background: var(--active); }
  .session.live::after {
    content: "●";
    color: var(--accent);
    font-size: 9px;
    margin-inline-start: 6px;
    vertical-align: middle;
  }
  .session-preview {
    font-size: 13px;
    line-height: 1.4;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    unicode-bidi: plaintext;
  }
  .session-meta {
    margin-top: 4px;
    font-size: 10px;
    color: var(--muted);
    font-family: ui-monospace, monospace;
    direction: ltr;
    text-align: start;
    unicode-bidi: plaintext;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .session-project {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .session-time { flex-shrink: 0; }

  .sidebar-search {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    direction: rtl;
  }
  .sidebar-search input {
    width: 100%;
    border: 1px solid var(--border-strong);
    background: var(--panel-2);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    font-family: inherit;
    outline: none;
  }
  .sidebar-search input:focus { border-color: #b6d4af; }

  #search-results {
    overflow-y: auto;
    flex: 1;
    direction: rtl;
  }
  .search-status {
    padding: 18px 14px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
  .search-hit {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .search-hit:hover { background: var(--hover); }
  .hit-meta {
    font-size: 10px;
    color: var(--muted);
    font-family: ui-monospace, monospace;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
    direction: ltr;
    unicode-bidi: plaintext;
  }
  .hit-role { flex-shrink: 0; }
  .hit-project {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .hit-snippet {
    font-size: 12px;
    line-height: 1.45;
    color: var(--text);
    unicode-bidi: plaintext;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }
  .hit-snippet mark {
    background: #ffe89e;
    color: inherit;
    padding: 0 2px;
    border-radius: 2px;
  }

  .msg.flash { animation: flashHit 1.6s ease-out; }
  @keyframes flashHit {
    0%   { box-shadow: 0 0 0 3px #ffe89e; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }

  .source-bar {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    direction: rtl;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .source-tabs {
    display: flex;
    gap: 2px;
    background: var(--panel-2);
    padding: 2px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
  }
  .src-tab {
    flex: 1;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }
  .src-tab.active {
    background: var(--panel);
    color: var(--text);
    box-shadow: 0 0 0 1px var(--border-strong);
  }
  .src-tab:not(.active):hover { color: var(--text); }
  #local-controls {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }
  #local-controls button {
    border: 1px solid var(--border-strong);
    background: var(--panel-2);
    color: var(--text);
    border-radius: 8px;
    padding: 4px 9px;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
  }
  #local-controls button:hover { background: var(--hover); }
  .local-status {
    font-size: 10px;
    color: var(--muted);
    font-family: ui-monospace, monospace;
    flex: 1;
    text-align: start;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .local-status.warn { color: #a33; }
</style>
</head>
<body dir="auto">
<div id="status">connecting…</div>
<div class="layout">
  <main class="main">
    <div class="main-header">
      <h1>Claude RTL viewer</h1>
      <span id="file"></span>
    </div>
    <div id="messages"></div>
    <div id="empty">ממתין לשיחה…</div>
  </main>
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">שיחות</span>
      <button id="latest-btn" class="latest-btn active" type="button">חדשה ביותר</button>
    </div>
    <div class="source-bar">
      <div class="source-tabs" role="tablist">
        <button class="src-tab active" data-source="server" type="button" role="tab">שרת מקומי</button>
        <button class="src-tab" data-source="local" type="button" role="tab">תיקייה בדפדפן</button>
      </div>
      <div id="local-controls" hidden>
        <button id="pick-folder" type="button">בחר תיקייה</button>
        <span id="local-status" class="local-status"></span>
      </div>
    </div>
    <div class="sidebar-search">
      <input id="search-input" type="search" placeholder="חיפוש בכל השיחות…" />
    </div>
    <div id="sessions"></div>
    <div id="search-results" hidden></div>
  </aside>
</div>
<script>
  marked.setOptions({ breaks: true, gfm: true });

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  marked.use({
    walkTokens(token) {
      if (token.type === "html") {
        token.text = escapeHtml(token.raw ?? token.text ?? "");
      }
    }
  });

  function renderMarkdown(text) {
    try { return marked.parse(text); }
    catch { return "<pre>" + escapeHtml(text) + "</pre>"; }
  }

  // ---------- jsonl parsing (mirrors server.ts) ----------
  const AUTO_BLOCK_PATTERNS = [
    /<system-reminder>[\s\S]*?<\/system-reminder>/g,
    /<command-[a-z-]+>[\s\S]*?<\/command-[a-z-]+>/g,
    /<local-command-[a-z-]+>[\s\S]*?<\/local-command-[a-z-]+>/g,
    /<user-prompt-submit-hook>[\s\S]*?<\/user-prompt-submit-hook>/g,
    /<ide_[a-z_]+>[\s\S]*?<\/ide_[a-z_]+>/g,
  ];
  function cleanUserText(text) {
    for (const re of AUTO_BLOCK_PATTERNS) text = text.replace(re, "");
    return text.trim();
  }
  function parseLine(line) {
    let obj;
    try { obj = JSON.parse(line); } catch { return []; }
    if (obj.isSidechain) return [];

    if (obj.type === "user" && obj.message?.content != null) {
      const c = obj.message.content;
      let text = "";
      if (typeof c === "string") text = c;
      else if (Array.isArray(c)) {
        text = c.filter(p => p?.type === "text" && typeof p.text === "string")
          .map(p => p.text).join("\n");
      }
      text = cleanUserText(text);
      if (!text) return [];
      if (/^<(ide_|command-|local-command-)/.test(text)) return [];
      return [{ uuid: obj.uuid, role: "user", text, timestamp: obj.timestamp }];
    }

    if (obj.type === "assistant" && Array.isArray(obj.message?.content)) {
      const out = [];
      const text = obj.message.content
        .filter(p => p?.type === "text" && typeof p.text === "string")
        .map(p => p.text).join("\n").trim();
      if (text) out.push({ uuid: obj.uuid, role: "assistant", text, timestamp: obj.timestamp });

      const tools = obj.message.content
        .filter(p => p?.type === "tool_use" && typeof p.name === "string")
        .map(p => p.name);
      if (tools.length) {
        out.push({
          uuid: text ? `${obj.uuid}#t` : obj.uuid,
          role: "tool",
          text: tools.join(", "),
          timestamp: obj.timestamp,
          tools,
        });
      }
      return out;
    }

    return [];
  }
  function parseJsonl(text) {
    const seen = new Set();
    const out = [];
    for (const line of text.split("\n")) {
      if (!line) continue;
      for (const m of parseLine(line)) {
        if (!seen.has(m.uuid)) { seen.add(m.uuid); out.push(m); }
      }
    }
    return out;
  }

  // ---------- shared DOM + render ----------
  const messagesEl = document.getElementById("messages");
  const sessionsEl = document.getElementById("sessions");
  const statusEl = document.getElementById("status");
  const fileEl = document.getElementById("file");
  const emptyEl = document.getElementById("empty");
  const latestBtn = document.getElementById("latest-btn");
  const localControlsEl = document.getElementById("local-controls");
  const localStatusEl = document.getElementById("local-status");
  const pickFolderBtn = document.getElementById("pick-folder");

  const RTL_TAGS = "p,li,h1,h2,h3,h4,h5,h6,blockquote,td,th";

  const rtf = new Intl.RelativeTimeFormat("he", { numeric: "auto" });
  function relTime(ms) {
    const diff = (ms - Date.now()) / 1000;
    const abs = Math.abs(diff);
    if (abs < 60) return rtf.format(Math.round(diff), "second");
    if (abs < 3600) return rtf.format(Math.round(diff / 60), "minute");
    if (abs < 86400) return rtf.format(Math.round(diff / 3600), "hour");
    if (abs < 86400 * 30) return rtf.format(Math.round(diff / 86400), "day");
    if (abs < 86400 * 365) return rtf.format(Math.round(diff / (86400 * 30)), "month");
    return rtf.format(Math.round(diff / (86400 * 365)), "year");
  }
  function projectLabel(proj) {
    return proj.replace(/^C--Users-eli-?/, "~/").replace(/-+/g, "/").replace(/\/$/, "") || "~";
  }

  function renderMessage(m) {
    const div = document.createElement("div");
    div.className = "msg " + m.role;
    div.dataset.uuid = m.uuid;
    if (m.role === "tool") {
      div.dir = "ltr";
      div.textContent = m.text;
      return div;
    }
    div.dir = "auto";
    const role = document.createElement("div");
    role.className = "role";
    role.textContent = m.role;
    const body = document.createElement("div");
    body.className = "body";
    body.dir = "auto";
    body.innerHTML = renderMarkdown(m.text);
    body.querySelectorAll(RTL_TAGS).forEach(el => { el.dir = "auto"; });
    div.append(role, body);
    return div;
  }
  function nearBottom() {
    return window.innerHeight + window.scrollY >= document.body.offsetHeight - 120;
  }

  // ---------- app state ----------
  let mode = "latest";          // "latest" | "pinned"
  let pinnedFile = null;
  let activeFile = null;
  let sessionsList = [];
  let pendingScrollUuid = null;
  let source = null;            // current Source instance

  function setStatus(s, cls) {
    statusEl.textContent = s;
    statusEl.classList.remove("live", "dead");
    if (cls) statusEl.classList.add(cls);
  }

  function applyReset(payload) {
    activeFile = payload.file || null;
    fileEl.textContent = activeFile ? activeFile.split(/[\\\/]/).pop() : "";
    messagesEl.innerHTML = "";
    for (const m of payload.messages) messagesEl.appendChild(renderMessage(m));
    emptyEl.style.display = payload.messages.length ? "none" : "block";
    if (pendingScrollUuid) {
      const target = messagesEl.querySelector(`[data-uuid="${CSS.escape(pendingScrollUuid)}"]`);
      pendingScrollUuid = null;
      if (target) {
        requestAnimationFrame(() => {
          target.scrollIntoView({ block: "center" });
          target.classList.add("flash");
          setTimeout(() => target.classList.remove("flash"), 1700);
        });
      } else {
        requestAnimationFrame(() => window.scrollTo(0, document.body.scrollHeight));
      }
    } else {
      requestAnimationFrame(() => window.scrollTo(0, document.body.scrollHeight));
    }
    paintSidebar();
  }

  function applyAppend(m) {
    const stick = nearBottom();
    messagesEl.appendChild(renderMessage(m));
    emptyEl.style.display = "none";
    if (stick) requestAnimationFrame(() => window.scrollTo(0, document.body.scrollHeight));
  }

  function paintSidebar() {
    sessionsEl.innerHTML = "";
    for (const s of sessionsList) {
      const item = document.createElement("div");
      item.className = "session";
      item.dataset.path = s.path;
      if (s.path === activeFile) item.classList.add("active");
      if (mode === "latest" && s === sessionsList[0]) item.classList.add("live");
      const preview = document.createElement("div");
      preview.className = "session-preview";
      preview.dir = "auto";
      preview.textContent = s.preview || "(שיחה ריקה)";
      const meta = document.createElement("div");
      meta.className = "session-meta";
      const proj = document.createElement("span");
      proj.className = "session-project";
      proj.textContent = projectLabel(s.project);
      const time = document.createElement("span");
      time.className = "session-time";
      time.textContent = relTime(s.mtime);
      meta.append(proj, time);
      item.append(preview, meta);
      item.addEventListener("click", () => pinTo(s.path));
      sessionsEl.appendChild(item);
    }
    latestBtn.classList.toggle("active", mode === "latest");
  }

  const handlers = {
    onStatus: setStatus,
    onSessions(list) { sessionsList = list; paintSidebar(); },
    onReset: applyReset,
    onAppend: applyAppend,
  };

  function pinTo(path) {
    mode = "pinned"; pinnedFile = path;
    if (source) source.setPinned(path);
    paintSidebar();
  }
  function followLatest() {
    mode = "latest"; pinnedFile = null;
    if (source) source.setLatestMode();
    paintSidebar();
  }
  latestBtn.addEventListener("click", followLatest);

  // ---------- ServerSource (SSE + /api) ----------
  class ServerSource {
    constructor(handlers, baseUrl = "") {
      this.handlers = handlers;
      this.baseUrl = baseUrl;
      this.es = null;
      this.mode = "latest";
      this.pinned = null;
    }
    start() { this._connect(); }
    setLatestMode() { this.mode = "latest"; this.pinned = null; this._connect(); }
    setPinned(path) { this.mode = "pinned"; this.pinned = path; this._connect(); }
    async search(q, limit = 60) {
      const res = await fetch(`${this.baseUrl}/api/search?q=${encodeURIComponent(q)}&limit=${limit}`);
      return await res.json();
    }
    destroy() { if (this.es) this.es.close(); this.es = null; }
    _connect() {
      if (this.es) this.es.close();
      const qs = this.mode === "pinned" && this.pinned ? `?file=${encodeURIComponent(this.pinned)}` : "";
      const es = new EventSource(`${this.baseUrl}/events${qs}`);
      es.addEventListener("ready", () => this.handlers.onStatus("live", "live"));
      es.addEventListener("sessions", e => this.handlers.onSessions(JSON.parse(e.data)));
      es.addEventListener("reset", e => this.handlers.onReset(JSON.parse(e.data)));
      es.addEventListener("append", e => this.handlers.onAppend(JSON.parse(e.data)));
      es.onerror = () => this.handlers.onStatus("reconnecting…", "dead");
      this.es = es;
    }
  }

  // ---------- LocalSource (File System Access + Observer) ----------
  class LocalSource {
    constructor(handlers, dirHandle) {
      this.handlers = handlers;
      this.dirHandle = dirHandle;
      this.mode = "latest";
      this.pinned = null;
      this.sessions = [];
      this.fileHandles = new Map();        // path -> FileSystemFileHandle
      this.fileSizes = new Map();          // path -> last seen size
      this.fileMessages = new Map();       // path -> { mtime, messages }
      this.observer = null;
      this.currentTarget = null;
      this.coalesceTimer = null;
    }

    async start() {
      this.handlers.onStatus("scanning…", "");
      try { await this._initialScan(); }
      catch (err) {
        console.error("scan:", err);
        this.handlers.onStatus("scan failed", "dead");
        return;
      }
      this.handlers.onSessions(this.sessions);
      await this._activateTarget();

      if (!("FileSystemObserver" in window)) {
        this.handlers.onStatus("no observer", "dead");
        return;
      }
      try {
        this.observer = new FileSystemObserver((records) => this._onRecords(records));
        await this.observer.observe(this.dirHandle, { recursive: true });
        this.handlers.onStatus("live", "live");
      } catch (err) {
        console.error("observe:", err);
        this.handlers.onStatus("observe failed", "dead");
      }
    }

    setLatestMode() { this.mode = "latest"; this.pinned = null; this._activateTarget(); }
    setPinned(path) { this.mode = "pinned"; this.pinned = path; this._activateTarget(); }

    async search(q, limit = 60) {
      const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
      if (!terms.length) return [];
      const hits = [];
      for (const s of this.sessions) {
        let messages;
        try { messages = await this._getMessages(s.path); } catch { continue; }
        for (const m of messages) {
          const lower = m.text.toLowerCase();
          let totalCount = 0;
          let firstIdx = -1;
          let ok = true;
          for (const term of terms) {
            let idx = lower.indexOf(term);
            if (idx === -1) { ok = false; break; }
            if (firstIdx === -1 || idx < firstIdx) firstIdx = idx;
            while (idx !== -1) { totalCount++; idx = lower.indexOf(term, idx + term.length); }
          }
          if (!ok) continue;
          const start = Math.max(0, firstIdx - 80);
          const end = Math.min(m.text.length, firstIdx + 220);
          const snippet =
            (start > 0 ? "…" : "") +
            m.text.slice(start, end).replace(/\s+/g, " ") +
            (end < m.text.length ? "…" : "");
          hits.push({
            path: s.path, project: s.project, uuid: m.uuid,
            role: m.role, timestamp: m.timestamp, snippet, score: totalCount,
          });
        }
      }
      hits.sort((a, b) => b.score - a.score || (b.timestamp || "").localeCompare(a.timestamp || ""));
      return hits.slice(0, limit);
    }

    destroy() {
      if (this.observer) {
        try { this.observer.disconnect(); } catch {}
        this.observer = null;
      }
      if (this.coalesceTimer) { clearTimeout(this.coalesceTimer); this.coalesceTimer = null; }
    }

    async _initialScan() {
      const sessions = [];
      this.fileHandles.clear();
      for await (const [projName, projHandle] of this.dirHandle.entries()) {
        if (projHandle.kind !== "directory") continue;
        for await (const [fileName, fileHandle] of projHandle.entries()) {
          if (fileHandle.kind !== "file" || !fileName.endsWith(".jsonl")) continue;
          const path = `${projName}/${fileName}`;
          this.fileHandles.set(path, fileHandle);
          let file;
          try { file = await fileHandle.getFile(); } catch { continue; }
          const preview = await this._readPreview(file);
          sessions.push({ path, project: projName, mtime: file.lastModified, preview });
        }
      }
      sessions.sort((a, b) => b.mtime - a.mtime);
      this.sessions = sessions;
    }

    async _readPreview(file) {
      try {
        const text = await file.slice(0, 32 * 1024).text();
        for (const line of text.split("\n")) {
          if (!line) continue;
          for (const m of parseLine(line)) {
            if (m.role === "user") return m.text.slice(0, 240);
          }
        }
      } catch {}
      return "";
    }

    async _getMessages(path) {
      const handle = this.fileHandles.get(path);
      if (!handle) return [];
      const file = await handle.getFile();
      const cached = this.fileMessages.get(path);
      if (cached && cached.mtime === file.lastModified) return cached.messages;
      const text = await file.text();
      const messages = parseJsonl(text);
      this.fileMessages.set(path, { mtime: file.lastModified, messages });
      return messages;
    }

    async _activateTarget() {
      const target = this.mode === "latest" ? (this.sessions[0]?.path ?? null) : this.pinned;
      this.currentTarget = target;
      if (!target) {
        this.handlers.onReset({ file: null, mode: this.mode, messages: [] });
        return;
      }
      const handle = this.fileHandles.get(target);
      if (!handle) {
        this.handlers.onReset({ file: null, mode: this.mode, messages: [] });
        return;
      }
      const file = await handle.getFile();
      this.fileSizes.set(target, file.size);
      const messages = await this._getMessages(target);
      this.handlers.onReset({ file: target, mode: this.mode, messages });
    }

    // FileSystemObserver fires bursts during rapid writes. Coalesce a short window
    // so a single tail-read picks up everything new.
    _onRecords(records) {
      for (const rec of records) this._stageRecord(rec);
      if (this.coalesceTimer) return;
      this.coalesceTimer = setTimeout(() => {
        this.coalesceTimer = null;
        this._flush().catch(err => console.error("flush:", err));
      }, 30);
    }

    _stageRecord(rec) {
      const rel = (rec.relativePathComponents ?? []).join("/");
      if (!rel || !rel.endsWith(".jsonl")) return;
      this._dirty ??= new Map();
      const prev = this._dirty.get(rel);
      // disappeared takes priority; otherwise keep the latest known handle
      if (rec.type === "disappeared") this._dirty.set(rel, { type: "disappeared" });
      else if (!prev || prev.type !== "disappeared") {
        this._dirty.set(rel, { type: rec.type, handle: rec.changedHandle });
      }
    }

    async _flush() {
      const dirty = this._dirty;
      this._dirty = new Map();
      if (!dirty || !dirty.size) return;

      const prevLatest = this.sessions[0]?.path ?? null;
      let sessionsChanged = false;
      let appendsForCurrent = [];
      let needsResetCurrent = false;

      for (const [rel, info] of dirty) {
        const proj = rel.split("/")[0];
        if (!proj) continue;

        if (info.type === "disappeared") {
          if (this.fileHandles.has(rel)) {
            this.fileHandles.delete(rel);
            this.fileMessages.delete(rel);
            this.fileSizes.delete(rel);
            this.sessions = this.sessions.filter(s => s.path !== rel);
            sessionsChanged = true;
            if (this.currentTarget === rel) needsResetCurrent = true;
          }
          continue;
        }

        let handle = this.fileHandles.get(rel);
        if (!handle && info.handle && info.handle.kind === "file") {
          handle = info.handle;
          this.fileHandles.set(rel, handle);
        }
        if (!handle) continue;

        let file;
        try { file = await handle.getFile(); } catch { continue; }

        const preview = await this._readPreview(file);
        const idx = this.sessions.findIndex(s => s.path === rel);
        const meta = { path: rel, project: proj, mtime: file.lastModified, preview };
        if (idx >= 0) {
          const prev = this.sessions[idx];
          if (prev.mtime !== meta.mtime || prev.preview !== meta.preview) {
            this.sessions[idx] = meta;
            sessionsChanged = true;
          }
        } else {
          this.sessions.push(meta);
          sessionsChanged = true;
        }

        if (this.currentTarget === rel) {
          const lastSize = this.fileSizes.get(rel) ?? 0;
          if (file.size < lastSize) {
            needsResetCurrent = true;
            this.fileSizes.set(rel, file.size);
            this.fileMessages.delete(rel);
          } else if (file.size > lastSize) {
            const slice = await file.slice(lastSize, file.size).text();
            this.fileSizes.set(rel, file.size);
            for (const line of slice.split("\n")) {
              if (!line) continue;
              for (const m of parseLine(line)) appendsForCurrent.push(m);
            }
          }
        }
      }

      if (sessionsChanged) {
        this.sessions.sort((a, b) => b.mtime - a.mtime);
        this.handlers.onSessions(this.sessions);
      }

      if (this.mode === "latest") {
        const latest = this.sessions[0]?.path ?? null;
        if (latest !== this.currentTarget) {
          await this._activateTarget();
          return;
        }
        // first sessions broadcast may have happened with prevLatest still null
        if (!prevLatest && latest) {
          await this._activateTarget();
          return;
        }
      }

      if (needsResetCurrent) { await this._activateTarget(); return; }

      if (appendsForCurrent.length) {
        const cached = this.fileMessages.get(this.currentTarget);
        const seen = new Set(cached?.messages.map(m => m.uuid) ?? []);
        for (const m of appendsForCurrent) {
          if (seen.has(m.uuid)) continue;
          seen.add(m.uuid);
          this.handlers.onAppend(m);
          if (cached) cached.messages.push(m);
        }
      }
    }
  }

  // ---------- IndexedDB helpers (persist directory handle) ----------
  function idb(mode) {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open("rtl-viewer", 1);
      req.onupgradeneeded = () => req.result.createObjectStore("kv");
      req.onerror = () => reject(req.error);
      req.onsuccess = () => {
        const db = req.result;
        const tx = db.transaction("kv", mode);
        resolve(tx.objectStore("kv"));
      };
    });
  }
  async function idbGet(key) {
    const store = await idb("readonly");
    return new Promise((resolve, reject) => {
      const r = store.get(key);
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  }
  async function idbSet(key, value) {
    const store = await idb("readwrite");
    return new Promise((resolve, reject) => {
      const r = store.put(value, key);
      r.onsuccess = () => resolve();
      r.onerror = () => reject(r.error);
    });
  }

  // ---------- source switching ----------
  const SOURCE_KEY = "rtl-viewer:source";
  const DIR_KEY = "rtl-viewer:dir";

  function setSourceTab(name) {
    document.querySelectorAll(".src-tab").forEach(b => {
      b.classList.toggle("active", b.dataset.source === name);
    });
    localControlsEl.hidden = name !== "local";
  }

  function setLocalStatus(text, warn = false) {
    localStatusEl.textContent = text;
    localStatusEl.classList.toggle("warn", warn);
  }

  function startSource(newSource) {
    if (source) source.destroy();
    source = newSource;
    sessionsList = [];
    activeFile = null;
    messagesEl.innerHTML = "";
    fileEl.textContent = "";
    emptyEl.style.display = "block";
    paintSidebar();
    if (mode === "pinned" && pinnedFile) source.setPinned?.(pinnedFile);
    source.start();
  }

  async function useServer() {
    setSourceTab("server");
    setLocalStatus("");
    localStorage.setItem(SOURCE_KEY, "server");
    startSource(new ServerSource(handlers));
  }

  async function useLocal(dirHandle, opts = {}) {
    if (!("FileSystemObserver" in window)) {
      setLocalStatus("FileSystemObserver לא נתמך בדפדפן הזה", true);
      return false;
    }
    setSourceTab("local");
    setLocalStatus(opts.label || "תיקייה נבחרה");
    localStorage.setItem(SOURCE_KEY, "local");
    try { await idbSet(DIR_KEY, dirHandle); } catch (err) { console.error("idbSet:", err); }
    startSource(new LocalSource(handlers, dirHandle));
    return true;
  }

  async function pickFolder() {
    if (!("showDirectoryPicker" in window)) {
      setLocalStatus("showDirectoryPicker לא נתמך", true);
      return;
    }
    let dirHandle;
    try {
      dirHandle = await window.showDirectoryPicker({ id: "claude-projects", mode: "read" });
    } catch { return; }
    await useLocal(dirHandle, { label: dirHandle.name });
  }

  async function tryRehydrateLocal() {
    const stored = await idbGet(DIR_KEY).catch(() => null);
    if (!stored) return false;
    try {
      const perm = await stored.queryPermission?.({ mode: "read" });
      if (perm === "granted") return await useLocal(stored, { label: stored.name });
      // Need a user gesture to re-grant — switch to local tab and prompt
      setSourceTab("local");
      setLocalStatus(`לחץ "בחר תיקייה" כדי לחדש הרשאה ל-${stored.name}`, true);
      return false;
    } catch {
      return false;
    }
  }

  pickFolderBtn.addEventListener("click", pickFolder);
  document.querySelectorAll(".src-tab").forEach(btn => {
    btn.addEventListener("click", async () => {
      const src = btn.dataset.source;
      if (src === "server") return useServer();
      // src === "local"
      setSourceTab("local");
      const ok = await tryRehydrateLocal();
      if (!ok && !source?.constructor?.name?.startsWith?.("Local")) {
        // no stored handle (or denied) — leave server source running until user picks
        if (!localStatusEl.textContent) setLocalStatus("בחר תיקייה כדי להתחיל");
      }
    });
  });

  async function init() {
    const pref = localStorage.getItem(SOURCE_KEY);
    if (pref === "local") {
      const ok = await tryRehydrateLocal();
      if (ok) return;
    }
    await useServer();
  }
  init();

  // ---------- search ----------
  const searchInput = document.getElementById("search-input");
  const searchResultsEl = document.getElementById("search-results");
  let searchTimer = null;
  let searchReqId = 0;
  let lastQuery = "";

  function highlightMatches(text, q) {
    let out = escapeHtml(text);
    const terms = q.split(/\s+/).filter(Boolean);
    for (const term of terms) {
      const escTerm = escapeHtml(term).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      if (!escTerm) continue;
      out = out.replace(new RegExp(escTerm, "gi"), m => `<mark>${m}</mark>`);
    }
    return out;
  }

  function renderSearchResults(hits, q) {
    searchResultsEl.innerHTML = "";
    if (hits.length === 0) {
      searchResultsEl.innerHTML = `<div class="search-status">אין תוצאות</div>`;
      return;
    }
    for (const hit of hits) {
      const item = document.createElement("div");
      item.className = "search-hit";
      const meta = document.createElement("div");
      meta.className = "hit-meta";
      const role = document.createElement("span");
      role.className = "hit-role";
      role.textContent = hit.role;
      const proj = document.createElement("span");
      proj.className = "hit-project";
      proj.textContent = projectLabel(hit.project);
      const time = document.createElement("span");
      time.className = "hit-time";
      time.textContent = hit.timestamp ? relTime(new Date(hit.timestamp).getTime()) : "";
      meta.append(role, proj, time);
      const snip = document.createElement("div");
      snip.className = "hit-snippet";
      snip.dir = "auto";
      snip.innerHTML = highlightMatches(hit.snippet, q);
      item.append(meta, snip);
      item.addEventListener("click", () => {
        pendingScrollUuid = hit.uuid;
        if (hit.path === activeFile && mode === "pinned") {
          const target = messagesEl.querySelector(`[data-uuid="${CSS.escape(hit.uuid)}"]`);
          pendingScrollUuid = null;
          if (target) {
            target.scrollIntoView({ block: "center" });
            target.classList.add("flash");
            setTimeout(() => target.classList.remove("flash"), 1700);
          }
        } else {
          pinTo(hit.path);
        }
      });
      searchResultsEl.appendChild(item);
    }
  }

  async function runSearch(q) {
    const reqId = ++searchReqId;
    sessionsEl.hidden = true;
    searchResultsEl.hidden = false;
    searchResultsEl.innerHTML = `<div class="search-status">מחפש…</div>`;
    try {
      const hits = source ? await source.search(q, 60) : [];
      if (reqId !== searchReqId) return;
      renderSearchResults(hits, q);
    } catch {
      if (reqId !== searchReqId) return;
      searchResultsEl.innerHTML = `<div class="search-status">שגיאה</div>`;
    }
  }

  function clearSearch() {
    lastQuery = "";
    searchReqId++;
    sessionsEl.hidden = false;
    searchResultsEl.hidden = true;
    searchResultsEl.innerHTML = "";
  }

  searchInput.addEventListener("input", () => {
    clearTimeout(searchTimer);
    const q = searchInput.value.trim();
    if (!q) { clearSearch(); return; }
    if (q === lastQuery) return;
    searchTimer = setTimeout(() => { lastQuery = q; runSearch(q); }, 220);
  });
  searchInput.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      searchInput.value = "";
      clearSearch();
      searchInput.blur();
    }
  });

  // Refresh relative times every 30s without a full repaint
  setInterval(() => {
    document.querySelectorAll(".session-time").forEach((el, i) => {
      const s = sessionsList[i];
      if (s) el.textContent = relTime(s.mtime);
    });
  }, 30000);
</script>
</body>
</html>
